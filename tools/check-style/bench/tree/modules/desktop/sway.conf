# Sway: tiled windows have no frame, floats have one pixel.
default_border pixel 1
gaps inner 0
gaps outer 0
for_window [app_id="foot"] opacity 1
for_window [floating] border pixel 1
bindsym $mod+Return exec foot
bindsym $mod+d exec fuzzel
bar {
    position top
    height 32
    status_command waybar
}
