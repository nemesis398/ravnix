[pytest]
# PyGObject warns that GLib.unix_signal_add_full is deprecated while it loads
# its own GLib override, which reads that name itself. The warning is raised
# in gi/overrides on every `from gi.repository import ...` in the test
# process, so it is neither backdrop's (whose stderr the tests prove clean) nor
# anything a test can avoid, and it says nothing of the code under test.
filterwarnings =
    ignore:GLib.unix_signal_add_full is deprecated:DeprecationWarning
