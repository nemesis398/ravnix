# Root in this container is root on the Docker host; this file adds to that.
# The top of docker-compose.yaml says what it means.
#
# What the container needs besides docker-compose.yaml for rootless Podman
# inside it to run containers. Start muninn with both files:
#
#   docker compose -f docker-compose.yaml -f docker-compose.podman.yaml up -d
#
# systempaths=unconfined   Docker masks parts of /proc and mounts /proc/sys
#                          read-only in every container. A nested container
#                          mounts a /proc of its own, and the kernel refuses
#                          that while the outer /proc has masked paths
#                          ("mount proc: Operation not permitted"). Root in
#                          muninn could already unmask them, because it has
#                          SYS_ADMIN and no AppArmor (see the top of the
#                          other file), so this grants no right that root did
#                          not have. What it changes is for everyone else:
#                          every process in muninn, the account's agents and
#                          the containers they run, sees /proc unmasked, and
#                          /proc/sys read-write for whoever has the
#                          capability. It is a file of its own because the
#                          base file does not need it.
# seccomp=./seccomp.json  Docker's default seccomp profile with one rule more:
#                          pivot_root, which Docker's allows to nobody,
#                          SYS_ADMIN or not. crun gives each container its
#                          root with it, and pasta, Podman's network for a
#                          rootless container, sandboxes itself with it
#                          ("Failed to pivot_root() into empty tmpfs" without
#                          it). Every process in muninn may already unshare
#                          a user and a mount namespace and mount in it under
#                          Docker's profile; pivot_root reaches nothing
#                          beyond that, and it keeps a nested container in
#                          its own root. Everything else of Docker's profile
#                          stays, the block on keyctl among them (the image
#                          sets keyring = false for it). The file is
#                          generated (packages/muninn-seccomp, pinned to the
#                          profile Docker 29.6.2 builds in) and workbench-oci
#                          fails when it is anything but that profile and
#                          pivot_root. Docker compose reads it next to
#                          docker-compose.yaml, on the client, so copy it
#                          with the compose files.
# /dev/net/tun             pasta opens it for the container's network.
#
# With the three, a container in muninn gets a root and a network of its own,
# published ports (-p) and `podman network` with names between containers,
# as on the VM.
services:
  muninn:
    security_opt:
      - systempaths=unconfined
      - seccomp=./seccomp.json
    devices:
      - /dev/net/tun:/dev/net/tun
