# 50-laptop.conf — the laptop's own input hardware: the touchpad, its gestures
# and the hotkey row. Installed as ~/.config/sway/config.d/50-laptop.conf and
# included by the trailing `include` of the main config, so it loads AFTER the
# shared bindings. It is the first user of the fragment seam (modules/desktop/
# sway.nix): another module adds its own file beside it.
# Output geometry/scale is kanshi's job (ravnix.laptop.kanshiProfiles) — none here.

# Touchpad: tap-to-click ON, click_method clickfinger.
# WHY clickfinger: sway resizes floating windows only via the floating_modifier
# drag ($mod + RIGHT-button held while dragging, `floating_modifier $mod normal`
# in the main config); on a touchpad a held right button needs a physical click
# method. clickfinger makes an N-finger physical press the button (1/2/3 =
# left/right/middle). So Super + TWO-finger press-and-drag = resize, Super +
# ONE-finger press-and-drag = move. Tap-to-click still works (tap_button_map
# lrm: 1/2/3-finger tap = left/right/middle). Natural scroll + dwt on.
# type-match survives device renames. Revert: set click_method back to none.
input type:touchpad {
    tap enabled
    click_method clickfinger
    natural_scroll enabled
    dwt enabled
}

# Touchpad gestures: 3-finger swipe for workspace navigation + scratchpad toggle.
# bindgesture is a TOP-LEVEL sway command (not nested inside `input
# type:touchpad`); swipe requires 3-5 fingers; direction semantics are
# physical-finger-direction (unaffected by natural_scroll).
bindgesture swipe:3:left  workspace next
bindgesture swipe:3:right workspace prev
bindgesture swipe:3:up    scratchpad show

# ── Extended gesture layer (Apple Magic Trackpad) ────────────────────────────
# The Magic Trackpad reports BTN_TOOL_QUINTTAP and libinput sizes it at 162x115mm
# (its own 50-system-apple.quirks), so 4-finger gestures are physically available
# AND comfortable here in a way they never were on the built-in pad.
#
# NOT scoped with --input-device, although bindgesture accepts one: a gesture that
# works on one pad and silently does nothing on the other is worse than one that
# works on both. The built-in pad simply has less room to perform them.
#
# The escalation rule, so this layer stays guessable instead of memorized:
#   3 fingers = move ME         (workspace left/right, scratchpad up/down)
#   4 fingers = move THE WINDOW (to a workspace, or change its shape)

# 3-down is the scratchpad MEMBERSHIP toggle: it puts the focused window away, and
# takes a scratchpad window back out into the tiling layout.
#
# It is a script and not `move scratchpad` because sway's scratchpad has three states
# and no command spans them. `scratchpad show` DISPLAYS a member without removing it:
# the window returns floating with scratchpad_state still "fresh", so it can never
# rejoin the layout however often you swipe. Only `floating disable` takes it out.
#
# 3-up deliberately keeps sway's own `scratchpad show`, so peeking at a stashed window
# and dismissing it again still works without committing to pulling it out.
bindgesture swipe:3:down  exec sway-scratchpad-toggle

# 4-finger horizontal: carry the focused window to the NUMERICALLY neighbouring
# workspace and follow it there. Directions match the 3-finger binds above
# (fingers moving left = forward).
#
# Why a script instead of `move container to workspace next`: sway's next/prev
# cycle through workspaces that EXIST, so with 1, 2 and 5 open they jump 2 -> 5
# and 3 and 4 are unreachable. By-number order is wanted, and sway has no
# relative-by-number command, so sway-move-workspace supplies it. It wraps
# 10 -> 1.
#
# CAVEAT, chosen deliberately and not an oversight: the 3-finger binds above still
# cycle EXISTING workspaces, so once the numbering has a gap the two rows agree on
# direction but land in different places. Do not "fix" it into consistency without
# deciding it.
bindgesture swipe:4:left   exec sway-move-workspace next
bindgesture swipe:4:right  exec sway-move-workspace prev

# 4-finger vertical: the two window-SHAPE commands. Both are toggles on purpose,
# so a mis-swipe is undone by repeating it. That matters more here than on a
# laptop pad: this surface has no tactile landmarks and gives no haptic feedback
# at all, because Linux never drives the Taptic Engine. You cannot feel where you
# are on it, so every gesture must be cheap to get wrong.
bindgesture swipe:4:up    fullscreen toggle
bindgesture swipe:4:down  floating toggle

# Pinch, THREE fingers, direction-qualified — sway's own documented pinch example,
# pinned to 3 fingers so the plain 2-finger pinch stays free. That matters: the
# browser, image viewers and Obsidian all handle a 2-finger pinch as zoom
# themselves, and a compositor-level bind would steal it from every one of them.
bindgesture pinch:3:inward+left   move left
bindgesture pinch:3:inward+right  move right
bindgesture pinch:3:inward+up     move up
bindgesture pinch:3:inward+down   move down

# 4-finger hold = close the focused window.
#
# `kill` is the one irreversible thing on this pad, so note WHY this shape is acceptable
# when a 4-finger swipe was rejected: four fingers laid down flat and held still is not
# something a palm or a sloppy scroll produces, while a swipe is exactly that.
#
# THIS WAS `pinch:4:inward`, and it moved because the radial launcher needs the
# 4-finger pinch. Sway decides gesture ownership at BEGIN on type and finger count
# ALONE (direction is not consulted until end), so a bind on pinch:4 in any
# direction swallows every 4-finger pinch before a launcher daemon reading its own
# libinput context could share it. 5 fingers is not available: libinput gates its
# whole gesture state machine behind `if (tp->gesture.finger_count <= 4)` in
# tp_gesture_post_events(), so `pinch:5` parses, returns success, and can never
# fire. Sway's man page advertising `pinch 2-5` is wrong.
#
# A 4-finger PINCH CANNOT FALL THROUGH INTO THIS BIND, which is the thing to check before
# trusting a destructive gesture. libinput opens a hold whenever fingers rest, then
# CANCELS it as soon as they move, and sway's handle_hold_end returns early on
# `event->cancelled` without executing the binding (sway 1.11, seatop_default.c:960).
# So starting a slow pinch produces HOLD_BEGIN then a cancelled HOLD_END and nothing runs.
# The failure mode of this bind is that a hold with a little finger drift does nothing.
# That is the right direction to fail in for `kill`.
#
# $mod+w still closes a window and is unaffected.
bindgesture hold:4  kill

# 4-finger PINCH belongs to the radial launcher (sway-radial), and this line is
# how it gets it. The radial launcher is a daemon of its own, a user service
# (modules/desktop/sway-radial.nix); without it the line is harmless: `nop` does
# nothing, and sway-mouse falls back to fuzzel when the daemon's service is not
# running.
#
# `nop` and not a real command: the daemon does not need sway to forward anything,
# because it reads the pad from its own libinput context. What it needs is for the
# pinch to stop reaching APPLICATIONS, which is what an unbound gesture does. Left
# unbound, a browser and the image viewers treat a 4-finger pinch as zoom, and you
# get a page zooming underneath the menu you just opened.
#
# It cannot steal the gesture from the daemon. Sway is a libinput client like any
# other and libinput does not grab, so both see every event.
bindgesture pinch:4 nop

# Disable $mod + scroll-wheel workspace cycling ON THE LAPTOP.
# The shared config binds `$mod+button4/5` (scroll up/down) to workspace
# prev/next_on_output — but on the touchpad a 2-finger scroll IS button4/5, so
# "Super + 2-finger scroll" jumped workspaces and clashed with the Super +
# 2-finger press-drag resize (an under-pressed press degrades into a scroll).
# unbindsym here (config.d loads AFTER the shared binds via the trailing include)
# removes it laptop-only; a desktop keeps Super+wheel.
# Flags MUST match the original bind (--whole-window) or the unbind won't match.
# Workspace switching stays on $mod+Tab / $mod+Shift+Tab and the 3-finger swipe.
unbindsym --whole-window $mod+button4
unbindsym --whole-window $mod+button5

# ── Hotkey row ───────────────────────────────────────────────────────────────
# fn_lock is 0 here, so a bare F-key sends its hotkey and Fn+F-key sends the
# plain F8/F10/F12. Only the hotkeys are bound; the plain F-keys stay free for
# applications (F12 devtools, F10 menus). Measured with wev:
#
#   F10 sends Super_L + l, not a key of its own. The firmware fakes the Windows
#   lock chord, so this binding is also what a typed Super+L does on any keyboard.
#   That is fine because $mod+l was unbound (focus moves on the arrow keys).
#   Do not bind $mod+l to anything else, or F10 does that instead of locking.
#   F12 sends XF86Calculator.
bindsym $mod+l          exec $lock
bindsym XF86Calculator  exec $calc
