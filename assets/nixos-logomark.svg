  9d2cdedd73d64a068214482902adea3d02783ba8, logo/nix-snowflake-colours.svg
  (the file that nixos-icons installs as nix-snowflake.svg).
  Title: NixOS logomark.
  Author: Simon Frankau (original design), revised by Tim Cuthbertson.
  Source:
